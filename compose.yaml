x-app: &app
  build: .
  image: operator-review:local
  env_file:
    - .env
  restart: unless-stopped

services:
  backend:
    <<: *app
    environment:
      PORT: "8000"
      DATA_DIR: /data
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - app_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    <<: *app
    command: ["python", "bot.py"]
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app_data:
