<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест с репетитором</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17233b;
        background: #f3f6fc;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #17233b;
        --muted: #75819a;
        --blue: #4263eb;
        --blue-dark: #3451cf;
        --line: #e5eaf3;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background:
          radial-gradient(ellipse at 12% 10%, rgb(91 123 255 / 10%), transparent 34rem),
          radial-gradient(ellipse at 92% 90%, rgb(59 183 158 / 8%), transparent 30rem),
          #f3f6fc;
      }

      main {
        width: min(100%, 560px);
        padding: 30px;
        border: 1px solid rgb(255 255 255 / 85%);
        border-radius: 24px;
        background: rgb(255 255 255 / 94%);
        box-shadow: 0 28px 80px rgb(33 52 94 / 11%), 0 3px 12px rgb(33 52 94 / 4%);
        backdrop-filter: blur(14px);
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 34px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: white;
        background: linear-gradient(145deg, #6e86ff, #4263eb);
        box-shadow: 0 7px 16px rgb(66 99 235 / 25%);
        font-size: 23px;
        font-weight: 800;
      }

      .brand-name {
        margin: 0;
        color: var(--ink);
        font-size: 14px;
        font-weight: 750;
        letter-spacing: -.01em;
      }

      .brand-caption {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .secure-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        padding: 7px 10px;
        border: 1px solid #e8edf5;
        border-radius: 999px;
        color: #748099;
        background: #fbfcfe;
        font-size: 11px;
        font-weight: 650;
      }

      .secure-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #35b58a;
        box-shadow: 0 0 0 3px rgb(53 181 138 / 12%);
      }

      .step-label {
        margin: 0 0 10px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(25px, 5vw, 32px);
        font-weight: 760;
        letter-spacing: -.045em;
        line-height: 1.15;
      }

      .intro {
        margin: 10px 0 26px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      form { display: grid; gap: 16px; }

      #profile-form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px 14px;
      }

      #profile-form label:first-of-type,
      #profile-error,
      #profile-button { grid-column: 1 / -1; }

      label {
        display: grid;
        gap: 8px;
        color: #34415b;
        font-size: 13px;
        font-weight: 680;
      }

      input {
        width: 100%;
        min-width: 0;
        height: 50px;
        padding: 0 14px;
        border: 1px solid #e0e6f0;
        border-radius: 12px;
        outline: none;
        color: var(--ink);
        background: #fbfcfe;
        font: inherit;
        font-size: 15px;
        transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      }

      input:hover { border-color: #cbd4e4; }

      input:focus {
        border-color: #7890ff;
        background: white;
        box-shadow: 0 0 0 4px rgb(66 99 235 / 11%);
      }

      button {
        min-height: 50px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: linear-gradient(135deg, #5574f4, #3e5fdf);
        box-shadow: 0 8px 18px rgb(66 99 235 / 22%);
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        cursor: pointer;
        transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 11px 22px rgb(66 99 235 / 28%);
        filter: saturate(1.08);
      }

      button:active:not(:disabled) { transform: translateY(0); }
      button:disabled { cursor: wait; opacity: .65; }

      button:focus-visible, input:focus-visible {
        outline: 3px solid rgb(120 144 255 / 50%);
        outline-offset: 3px;
      }

      [hidden] { display: none !important; }

      .error {
        margin: 0;
        color: #b42332;
        font-size: 13px;
        line-height: 1.5;
      }

      .result { padding: 20px 4px 8px; text-align: center; }

      .result h1 { margin-bottom: 12px; }
      .result p:not(.step-label) { color: var(--muted); line-height: 1.65; }
      .result button { width: 100%; margin-top: 16px; }

      #quiz-screen { padding-top: 2px; }
      #question {
        margin: 18px 0 25px;
        padding: 20px;
        border: 1px solid #e8edfb;
        border-radius: 16px;
        color: #24365c;
        background: linear-gradient(135deg, #f6f8ff, #f9fbff);
        font-size: clamp(20px, 4vw, 25px);
        font-weight: 720;
        letter-spacing: -.025em;
        line-height: 1.4;
        text-align: center;
      }

      #yes-no-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      #yes-no-buttons button:last-child {
        border: 1px solid #e0e6f0;
        color: #3a4965;
        background: #f7f9fc;
        box-shadow: none;
      }

      dialog {
        width: min(calc(100% - 32px), 390px);
        padding: 32px;
        border: 0;
        border-radius: 22px;
        color: var(--ink);
        background: white;
        text-align: center;
        box-shadow: 0 25px 80px rgb(12 22 47 / 25%);
      }

      dialog::backdrop {
        background: rgb(19 30 55 / 42%);
        backdrop-filter: blur(5px);
      }

      dialog p { line-height: 1.6; }
      #connection-status { color: var(--muted); font-size: 12px; }

      .spinner {
        width: 46px;
        height: 46px;
        margin: 0 auto 20px;
        border: 4px solid #e8edfb;
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin .8s cubic-bezier(.5, .1, .5, .9) infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 520px) {
        body { align-items: flex-start; padding: 18px 12px; }
        main { padding: 23px 19px; border-radius: 20px; }
        .brand-row { margin-bottom: 30px; }
        .secure-badge { padding: 7px 8px; font-size: 10px; }
      }

      @media (max-width: 380px) {
        #profile-form { grid-template-columns: 1fr; }
        #profile-form label:first-of-type,
        #profile-error,
        #profile-button { grid-column: auto; }
        .brand-caption { font-size: 11px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brand-row">
        <div class="brand-mark" aria-hidden="true">π</div>
        <div>
          <p class="brand-name">Математика рядом</p>
          <p class="brand-caption">Занятие с репетитором</p>
        </div>
        <div class="secure-badge"><span class="secure-dot" aria-hidden="true"></span>Связь активна</div>
      </header>

      <section id="profile-screen">
        <p class="step-label">Шаг 1 · Знакомство</p>
        <h1>Начнём занятие</h1>
        <p class="intro">Заполните данные, чтобы репетитор мог подготовить для вас задание.</p>
        <form id="profile-form">
          <label>
            Ваше имя
            <input name="student_name" type="text" autocomplete="name" required>
          </label>
          <label>
            Номер потока
            <input name="stream_number" type="text" required>
          </label>
          <label>
            Номер курса
            <input name="course_number" type="text" required>
          </label>
          <label>
            Номер класса
            <input name="class_number" type="text" required>
          </label>
          <p id="profile-error" class="error" role="alert" hidden></p>
          <button id="profile-button" type="submit">Отправить данные</button>
        </form>
      </section>

      <section id="quiz-screen" hidden>
        <p class="step-label">Занятие · Ответ</p>
        <h1 id="quiz-title">Задание</h1>
        <p id="question"></p>
        <form id="answer-form">
          <label>
            Ваш ответ
            <input name="answer" type="text" autocomplete="off" required>
          </label>
          <button id="answer-button" type="submit">Отправить ответ</button>
        </form>
        <div id="yes-no-buttons" hidden>
          <button type="button" data-answer="Да">Да</button>
          <button type="button" data-answer="Нет">Нет</button>
        </div>
        <p id="answer-feedback" class="error" role="alert" aria-live="polite"></p>
      </section>

      <section id="complete-screen" class="result" hidden>
        <p class="step-label">Занятие · Результат</p>
        <h1 id="complete-title">Урок завершён</h1>
        <p id="complete-message"></p>
        <button id="edit-profile-button" type="button" hidden>Проверить данные</button>
      </section>
    </main>

    <dialog id="loading-dialog" aria-labelledby="loading-message">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-message" aria-live="polite">
        Пожалуйста, подождите. Репетитор обрабатывает ваши данные...
      </p>
      <p id="connection-status"></p>
    </dialog>

    <script>
      const profileForm = document.querySelector("#profile-form");
      const profileScreen = document.querySelector("#profile-screen");
      const answerForm = document.querySelector("#answer-form");
      const quizScreen = document.querySelector("#quiz-screen");
      const yesNoButtons = document.querySelector("#yes-no-buttons");
      const loadingDialog = document.querySelector("#loading-dialog");
      const connectionStatus = document.querySelector("#connection-status");
      let socket;
      let reconnectTimer;
      let reconnectDelay = 500;
      let activeSessionId;
      let currentStage;

      function showQuiz(stage, prompt, feedback = "") {
        currentStage = stage;
        document.querySelector("#quiz-title").textContent =
          stage === "question" ? "Вопрос" : "Задача";
        document.querySelector("#question").textContent = prompt;
        answerForm.hidden = stage === "question";
        yesNoButtons.hidden = stage !== "question";
        document.querySelector("#answer-feedback").textContent = feedback;
        document.querySelector("#answer-button").disabled = false;
        yesNoButtons.querySelectorAll("button").forEach((button) => {
          button.disabled = false;
        });
        quizScreen.hidden = false;
      }

      function connectToSession(sessionId) {
        activeSessionId = sessionId;
        if (socket && (socket.readyState === WebSocket.OPEN
          || socket.readyState === WebSocket.CONNECTING)) return;
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${location.host}/ws/${encodeURIComponent(sessionId)}`);

        socket.addEventListener("open", () => {
          reconnectDelay = 500;
          connectionStatus.textContent = "";
        });
        socket.addEventListener("message", (event) => {
          let packet;
          try {
            packet = JSON.parse(event.data);
          } catch {
            connectionStatus.textContent = "Получен некорректный ответ сервера.";
            return;
          }
          if (packet.action !== "change_screen") return;
          if (packet.target === "task" || packet.target === "question") {
            clearTimeout(reconnectTimer);
            loadingDialog.close();
            showQuiz(packet.target, packet.prompt);
            return;
          }
          if (packet.target === "incorrect") {
            clearTimeout(reconnectTimer);
            loadingDialog.close();
            showQuiz(packet.stage, packet.prompt, packet.feedback);
            return;
          }

          if (packet.target === "correct" || packet.target === "error") {
            clearTimeout(reconnectTimer);
            loadingDialog.close();
            activeSessionId = null;
            currentStage = null;
            socket.close();
            quizScreen.hidden = true;
            document.querySelector("#complete-screen").hidden = false;
            document.querySelector("#complete-title").textContent =
              packet.target === "correct" ? "Ответ верный!" : "Ошибка";
            document.querySelector("#complete-message").textContent =
              packet.feedback || "";
            document.querySelector("#edit-profile-button").hidden =
              packet.target !== "error";
          }
        });
        socket.addEventListener("close", (event) => {
          if (!activeSessionId) return;
          if (event.code === 1008) {
            activeSessionId = null;
            loadingDialog.close();
            profileScreen.hidden = false;
            document.querySelector("#profile-error").textContent =
              "Урок не найден. Отправьте данные ещё раз.";
            document.querySelector("#profile-error").hidden = false;
            return;
          }
          connectionStatus.textContent = "Восстанавливаем соединение...";
          reconnectTimer = setTimeout(() => {
            reconnectDelay = Math.min(reconnectDelay * 2, 10000);
            connectToSession(activeSessionId);
          }, reconnectDelay);
        });
        socket.addEventListener("error", () => socket.close());
      }

      profileForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const nameInput = profileForm.elements.student_name;
        nameInput.value = nameInput.value.trim();
        if (!profileForm.reportValidity()) return;
        const values = Object.fromEntries(new FormData(profileForm));
        const profile = {
          student_name: values.student_name.trim(),
          stream_number: values.stream_number.trim(),
          course_number: values.course_number.trim(),
          class_number: values.class_number.trim(),
        };
        const profileError = document.querySelector("#profile-error");
        const profileButton = document.querySelector("#profile-button");
        profileError.hidden = true;
        profileButton.disabled = true;
        profileScreen.hidden = true;
        loadingDialog.showModal();
        try {
          const response = await fetch("/api/submissions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(profile),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.detail || "Не удалось отправить данные.");
          }
          activeSessionId = result.session_id;
          connectToSession(activeSessionId);
        } catch (error) {
          loadingDialog.close();
          profileScreen.hidden = false;
          profileError.textContent = error.message || "Ошибка соединения с сервером.";
          profileError.hidden = false;
          profileButton.disabled = false;
        }
      });

      async function submitAnswer(answer) {
        if (!answer || !activeSessionId) return;
        document.querySelector("#answer-button").disabled = true;
        yesNoButtons.querySelectorAll("button").forEach((button) => {
          button.disabled = true;
        });
        quizScreen.hidden = true;
        document.querySelector("#loading-message").textContent =
          "Пожалуйста, подождите. Репетитор проверяет ваш ответ...";
        connectionStatus.textContent = "";
        loadingDialog.showModal();
        try {
          const response = await fetch(
            `/api/sessions/${encodeURIComponent(activeSessionId)}/answers`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.detail || "Не удалось отправить ответ.");
          }
          if (currentStage === "task") answerForm.reset();
        } catch (error) {
          loadingDialog.close();
          showQuiz(
            currentStage,
            document.querySelector("#question").textContent,
            error.message || "Ошибка соединения с сервером.",
          );
        }
      }

      answerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const answer = new FormData(answerForm).get("answer").trim();
        submitAnswer(answer);
      });

      yesNoButtons.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-answer]");
        if (button) submitAnswer(button.dataset.answer);
      });

      document.querySelector("#edit-profile-button").addEventListener("click", () => {
        document.querySelector("#complete-screen").hidden = true;
        document.querySelector("#edit-profile-button").hidden = true;
        document.querySelector("#profile-error").hidden = true;
        document.querySelector("#profile-button").disabled = false;
        profileScreen.hidden = false;
        profileForm.elements.student_name.focus();
      });

      sessionStorage.removeItem("pendingSessionId");
    </script>
  </body>
</html>
