<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тест с репетитором</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f5f9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 480px);
        padding: 32px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 40px rgb(23 32 51 / 10%);
      }

      h1 { margin-top: 0; font-size: 1.5rem; }

      form { display: grid; gap: 18px; }

      label { display: grid; gap: 7px; font-weight: 600; }

      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #c9cfdb;
        border-radius: 8px;
        font: inherit;
      }

      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #c9cfdb;
        border-radius: 8px;
        font: inherit;
        resize: vertical;
      }

      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #2457d6;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible, input:focus-visible {
        outline: 3px solid #90abff;
        outline-offset: 2px;
      }

      [hidden] { display: none !important; }

      .error { color: #a62020; }
      .result { text-align: center; }

      dialog {
        width: min(calc(100% - 32px), 440px);
        padding: 30px;
        border: 0;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 18px 60px rgb(0 0 0 / 24%);
      }

      dialog::backdrop { background: rgb(12 18 32 / 68%); }

      .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 4px solid #dce4f7;
        border-top-color: #2457d6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="quiz-screen">
        <h1>Задание по математике</h1>
        <p id="question">Сколько будет 7 × 8?</p>
        <form id="answer-form">
          <label>
            Твой ответ
            <input name="answer" type="text" maxlength="200" autocomplete="off" required>
          </label>
          <button id="answer-button" type="submit">Отправить репетитору</button>
          <p id="answer-error" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section id="feedback-screen" class="result" hidden>
        <h1 id="feedback-title">Обратная связь</h1>
        <p id="feedback-message" aria-live="polite"></p>
        <button id="continue-button" type="button">Ответить ещё раз</button>
      </section>

      <section id="complete-screen" class="result" hidden>
        <h1 id="complete-title">Урок завершён</h1>
        <p id="complete-message"></p>
      </section>
    </main>

    <dialog id="loading-dialog" aria-labelledby="loading-message">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-message" aria-live="polite">
        Подождите, репетитор проверяет ваш ответ...
      </p>
      <p id="connection-status"></p>
    </dialog>

    <script>
      const answerForm = document.querySelector("#answer-form");
      const quizScreen = document.querySelector("#quiz-screen");
      const loadingDialog = document.querySelector("#loading-dialog");
      const connectionStatus = document.querySelector("#connection-status");
      const screens = {
        hint: document.querySelector("#feedback-screen"),
        retry: document.querySelector("#feedback-screen"),
        explain: document.querySelector("#feedback-screen"),
        correct: document.querySelector("#complete-screen"),
        finish: document.querySelector("#complete-screen"),
      };
      const feedbackTitles = {
        hint: "Подсказка",
        retry: "Попробуй ещё раз",
        explain: "Объяснение",
      };
      let socket;
      let reconnectTimer;
      let reconnectDelay = 500;
      let activeSessionId;

      function connectToSession(sessionId) {
        activeSessionId = sessionId;
        if (socket && (socket.readyState === WebSocket.OPEN
          || socket.readyState === WebSocket.CONNECTING)) return;
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${location.host}/ws/${encodeURIComponent(sessionId)}`);

        socket.addEventListener("open", () => {
          reconnectDelay = 500;
          connectionStatus.textContent = "";
        });
        socket.addEventListener("message", (event) => {
          let packet;
          try {
            packet = JSON.parse(event.data);
          } catch {
            connectionStatus.textContent = "Получен некорректный ответ сервера.";
            return;
          }
          if (packet.action === "change_screen" && screens[packet.target]) {
            clearTimeout(reconnectTimer);
            loadingDialog.close();
            if (["hint", "retry", "explain"].includes(packet.target)) {
              document.querySelector("#feedback-title").textContent =
                feedbackTitles[packet.target];
              document.querySelector("#feedback-message").textContent =
                packet.feedback || "";
              quizScreen.hidden = true;
              screens[packet.target].hidden = false;
              return;
            }

            activeSessionId = null;
            sessionStorage.removeItem("pendingSessionId");
            socket.close();
            quizScreen.hidden = true;
            document.querySelector("#feedback-screen").hidden = true;
            document.querySelector("#complete-screen").hidden = false;
            document.querySelector("#complete-title").textContent =
              packet.target === "correct" ? "Ответ верный!" : "Урок завершён";
            document.querySelector("#complete-message").textContent =
              packet.feedback || "";
          }
        });
        socket.addEventListener("close", (event) => {
          if (!activeSessionId) return;
          if (event.code === 1008) {
            activeSessionId = null;
            sessionStorage.removeItem("pendingSessionId");
            loadingDialog.close();
            quizScreen.hidden = false;
            const answerError = document.querySelector("#answer-error");
            answerError.textContent = "Урок не найден. Начните тест заново.";
            answerError.hidden = false;
            document.querySelector("#answer-button").disabled = false;
            return;
          }
          connectionStatus.textContent = "Восстанавливаем соединение...";
          reconnectTimer = setTimeout(() => {
            reconnectDelay = Math.min(reconnectDelay * 2, 10000);
            connectToSession(activeSessionId);
          }, reconnectDelay);
        });
        socket.addEventListener("error", () => socket.close());
      }

      answerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const answerError = document.querySelector("#answer-error");
        answerError.hidden = true;
        const answer = new FormData(answerForm).get("answer").trim();
        const button = document.querySelector("#answer-button");
        if (!answer) return;
        button.disabled = true;
        quizScreen.hidden = true;
        loadingDialog.showModal();

        try {
          const isFollowUp = Boolean(activeSessionId);
          const response = await fetch(isFollowUp
            ? `/api/sessions/${encodeURIComponent(activeSessionId)}/answers`
            : "/api/submissions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.detail || "Не удалось отправить ответ.");
          }

          answerForm.reset();
          if (!isFollowUp) {
            activeSessionId = result.session_id;
            sessionStorage.setItem("pendingSessionId", result.session_id);
          }
          connectToSession(activeSessionId);
        } catch (error) {
          loadingDialog.close();
          quizScreen.hidden = false;
          answerError.textContent = error.message || "Ошибка соединения с сервером.";
          answerError.hidden = false;
          button.disabled = false;
        }
      });

      document.querySelector("#continue-button").addEventListener("click", () => {
        document.querySelector("#feedback-screen").hidden = true;
        quizScreen.hidden = false;
        document.querySelector("#answer-button").disabled = false;
        answerForm.querySelector("[name=answer]").focus();
      });

      const pendingSessionId = sessionStorage.getItem("pendingSessionId");
      if (pendingSessionId) {
        quizScreen.hidden = true;
        loadingDialog.showModal();
        connectToSession(pendingSessionId);
      }
    </script>
  </body>
</html>
